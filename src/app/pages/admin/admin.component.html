<app-toolbar [stuck]="true"></app-toolbar>

<div class="shell">
  <header class="head">
    <h1>Admin</h1>
    <p class="sub">
      Content operations for todayinsports.app.
      <span class="mono" *ngIf="!loading">{{ questions.totalGenerated }} in the bank</span>
    </p>
  </header>

  <!-- Section tabs belong to this page. The site navigation stays where it is
       on every other page, because admin is a page here, not a separate app. -->
  <nav class="tabs" aria-label="Admin sections">
    <a *ngFor="let t of tabs" [routerLink]="t.path" routerLinkActive="active">
      {{ t.label }}
    </a>
  </nav>

  <main>
    <p class="notice" *ngIf="loading">Loading the question bank…</p>
    <p class="notice error" *ngIf="error">{{ error }}</p>
    <router-outlet *ngIf="!loading && !error"></router-outlet>
  </main>
</div>
