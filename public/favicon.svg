<!--
  The square brand mark: the scoreboard, cropped.

  Deliberately not the dot-matrix cut used on the hero lockup. "TIS" in dot
  matrix is roughly twenty dot-columns wide, so at a 32px favicon each dot
  lands under two pixels and the whole thing greys out. These are solid block
  letterforms for that reason, and there are no ball illustrations for the
  same one — four balls in a 16px square is mud.

  The five lamps are the brand's own device: five questions, every day.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="Today in Sports">
  <title>Today in Sports</title>

  <!-- The board. Flat, no gradient: a bevel at favicon size is just noise. -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0f1728"/>
  <rect x="1.25" y="1.25" width="97.5" height="97.5" rx="20.75"
        fill="none" stroke="#26314a" stroke-width="2.5"/>

  <!-- Five lamps. -->
  <g fill="#f5a524">
    <circle cx="26" cy="22" r="3.6"/>
    <circle cx="38" cy="22" r="3.6"/>
    <circle cx="50" cy="22" r="3.6"/>
    <circle cx="62" cy="22" r="3.6"/>
    <circle cx="74" cy="22" r="3.6"/>
  </g>

  <!-- T -->
  <g fill="#e8edf5">
    <rect x="14.5" y="38" width="24" height="10"/>
    <rect x="21.5" y="38" width="10" height="40"/>
  </g>

  <!-- I, in the brand red. The one place red appears in the mark. -->
  <rect x="45.5" y="38" width="9" height="40" fill="#d6212f"/>

  <!-- S, built from bars so it stays crisp on the pixel grid. -->
  <g fill="#e8edf5">
    <rect x="60.5" y="38" width="24" height="10"/>
    <rect x="60.5" y="53" width="24" height="10"/>
    <rect x="60.5" y="68" width="24" height="10"/>
    <rect x="60.5" y="38" width="10" height="25"/>
    <rect x="74.5" y="53" width="10" height="25"/>
  </g>
</svg>
