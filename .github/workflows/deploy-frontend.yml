name: Deploy Frontend

on:
  push:
    branches: [master]
    paths: ['src/**', 'public/**', 'angular.json', 'package.json', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: today-in-sports
      node-version: '20'
      build-command: npx ng build --configuration production
      dist-dir: dist/today-in-sports-frontend/browser
      bucket: todayinsports.app
      domain: todayinsports.app
